<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브 카페 주문서</title>
  <!-- 스타일 파일 연결 -->
  <link rel="stylesheet" href="style.css">
  <!-- Supabase v2를 먼저 연결합니다. defer를 쓰면 적힌 순서대로 실행됩니다. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <!-- 기능 파일 연결: 문서가 준비된 뒤 실행 -->
  <script src="script.js" defer></script>
</head>
<body>
  <!-- 카페 로고, 이름과 부제 -->
  <header>
    <h1><span class="cafe-logo" role="img" aria-label="커피 로고">☕</span> 나부나부나 카페</h1>
    <p>당신의 하루에 감성을 더하다</p>
    <!-- 탭 버튼은 연결된 영역을 보여주고, 선택된 탭에는 밑줄을 표시합니다. -->
    <div class="tab-menu" role="tablist" aria-label="카페 주문 메뉴">
      <button type="button" id="order-tab" class="tab-button active" role="tab" aria-selected="true" aria-controls="order-panel">☕ 주문하기</button>
      <button type="button" id="history-tab" class="tab-button" role="tab" aria-selected="false" aria-controls="history-panel" tabindex="-1">📋 주문 내역 <span id="order-count" class="order-count">0</span></button>
    </div>
  </header>

  <main>
    <!-- 주문서와 확인 메시지는 주문하기 탭 안에 함께 둡니다. -->
    <section id="order-panel" role="tabpanel" aria-labelledby="order-tab">
      <!-- 이름 필수 검사는 나중에 자바스크립트로 처리 -->
      <form id="order-form" novalidate>
        <!-- 주문자 정보 -->
        <div>
          <label for="customer-name">이름 (필수)</label>
          <input type="text" id="customer-name" name="customer-name" required>
        </div>
        <div>
          <label for="customer-phone">전화번호</label>
          <input type="tel" id="customer-phone" name="customer-phone">
        </div>

        <!-- 음료 가격은 각 항목의 데이터 속성에 저장 -->
        <div>
          <label for="drink">음료 선택</label>
          <select id="drink" name="drink">
            <option value="" data-price="0" selected>-- 음료를 선택하세요 --</option>
            <option value="americano" data-price="3500">아메리카노 3,500원</option>
            <option value="cafe-latte" data-price="4000">카페라떼 4,000원</option>
            <option value="cafe-mocha" data-price="4500">카페모카 4,500원</option>
            <option value="vanilla-latte" data-price="4500">바닐라라떼 4,500원</option>
            <option value="green-tea-latte" data-price="4500">녹차라떼 4,500원</option>
            <option value="cappuccino" data-price="4000">카푸치노 4,000원</option>
            <option value="caramel-macchiato" data-price="4500">카라멜마키아토 4,500원</option>
            <option value="chocolate-latte" data-price="4500">초코라떼 4,500원</option>
            <option value="sweet-potato-latte" data-price="4500">고구마라떼 4,500원</option>
            <option value="strawberry-latte" data-price="5000">딸기라떼 5,000원</option>
            <option value="lemon-ade" data-price="4500">레몬에이드 4,500원</option>
            <option value="peach-iced-tea" data-price="4000">복숭아 아이스티 4,000원</option>
            <option value="chamomile-tea" data-price="3500">캐모마일 티 3,500원</option>
            <option value="flat-white" data-price="4500">플랫화이트 4,500원</option>
            <option value="cold-brew" data-price="4500">콜드브루 4,500원</option>
            <option value="hazelnut-latte" data-price="4500">헤이즐넛라떼 4,500원</option>
            <option value="black-sesame-latte" data-price="5000">흑임자라떼 5,000원</option>
            <option value="mint-chocolate-latte" data-price="5000">민트초코라떼 5,000원</option>
            <option value="royal-milk-tea" data-price="4500">로열 밀크티 4,500원</option>
            <option value="grapefruit-ade" data-price="4500">자몽에이드 4,500원</option>
            <option value="green-grape-ade" data-price="4500">청포도에이드 4,500원</option>
            <option value="earl-grey-tea" data-price="3500">얼그레이 티 3,500원</option>
            <option value="yuja-tea" data-price="4000">유자차 4,000원</option>
          </select>
        </div>

        <!-- 사이즈 선택: 기본값은 M -->
        <fieldset>
          <legend>사이즈</legend>
          <input type="radio" id="size-s" name="size" value="S" data-price="0">
          <label for="size-s">S +0원</label>
          <input type="radio" id="size-m" name="size" value="M" data-price="500" checked>
          <label for="size-m">M +500원</label>
          <input type="radio" id="size-l" name="size" value="L" data-price="1000">
          <label for="size-l">L +1,000원</label>
        </fieldset>

        <!-- 추가 옵션은 여러 개 선택 가능 -->
        <fieldset>
          <legend>추가 옵션</legend>
          <input type="checkbox" id="extra-shot" name="extras" value="shot" data-price="500">
          <label for="extra-shot">샷 추가 +500원</label>
          <input type="checkbox" id="extra-cream" name="extras" value="cream" data-price="500">
          <label for="extra-cream">크림 추가 +500원</label>
          <input type="checkbox" id="extra-syrup" name="extras" value="syrup" data-price="300">
          <label for="extra-syrup">시럽 추가 +300원</label>
          <input type="checkbox" id="extra-decaf" name="extras" value="decaf" data-price="0">
          <label for="extra-decaf">디카페인 +0원</label>
        </fieldset>

        <!-- 수량과 요청사항 -->
        <div>
          <label for="quantity">수량</label>
          <input type="number" id="quantity" name="quantity" min="1" max="10" value="1">
        </div>
        <div>
          <label for="requests">요청사항</label>
          <textarea id="requests" name="requests" rows="4"></textarea>
        </div>

        <!-- 예상 금액과 주문 버튼 -->
        <p id="estimated-total" aria-live="polite">예상 금액: <span id="total-price">0</span>원</p>
        <button type="submit" id="submit-order">주문하기</button>
        <button type="reset" id="reset-order">다시 작성</button>
      </form>

      <!-- 주문 확인 메시지 영역: 처음에는 숨김 -->
      <div id="order-confirmation" class="hidden" role="status"></div>
    </section>

    <!-- 주문 내역 탭은 처음에 숨기고, 목록은 자바스크립트로 채웁니다. -->
    <section id="history-panel" class="hidden" role="tabpanel" aria-labelledby="history-tab" tabindex="0">
      <div id="orders-list" aria-live="polite"></div>
      <div id="orders-summary" class="orders-summary hidden">
        <p id="orders-total"></p>
        <button type="button" id="clear-orders">내역 모두 지우기</button>
      </div>
    </section>
  </main>
</body>
</html>
